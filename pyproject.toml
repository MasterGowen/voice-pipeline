[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-pipeline"
version = "0.1.0"
description = "TTS Pipeline для генерации аудио через OpenRouter/Gemini API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Author", email = "author@example.com"}
]
keywords = ["tts", "audio", "gemini", "openrouter", "text-to-speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
tts-pipeline = "tts_pipeline.main:main_entry"

[project.urls]
Homepage = "https://github.com/your-username/tts-pipeline"
Repository = "https://github.com/your-username/tts-pipeline.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["tts_pipeline*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]
